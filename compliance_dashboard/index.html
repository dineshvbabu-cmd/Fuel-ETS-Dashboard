<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel ETS Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="page-shell">
    <header class="topbar">
      <div class="brand-block">
        <p class="eyebrow">Operational Compliance</p>
        <h1>Fuel ETS Dashboard</h1>
        <p class="topbar-copy">Voyage-level EU ETS and FuelEU analytics with in-app calculator inputs and a hidden reference library.</p>
      </div>

      <div class="topbar-controls">
        <div id="viewTabs" class="view-tabs"></div>

        <label class="toolbar-field">
          <span>Vessel filter</span>
          <select id="vesselFilter" class="toolbar-select"></select>
        </label>

        <button id="libraryToggleButton" class="icon-button" type="button" title="Open calculation library">☰</button>
        <button id="exportFilteredButton" class="icon-button" type="button" title="Export selected vessel data">⤓</button>
        <button id="resetWorkbookButton" class="icon-button" type="button" title="Reset all scenario data">↺</button>
      </div>
    </header>

    <section id="kpiGrid" class="kpi-grid"></section>
    <main id="contentView" class="content-view"></main>
  </div>

  <div id="libraryBackdrop" class="library-backdrop"></div>
  <aside id="libraryDrawer" class="library-drawer">
    <div class="library-head">
      <div>
        <p class="eyebrow">Reference Library</p>
        <h2>Hidden Calculation Sheets</h2>
      </div>
      <button id="closeLibraryButton" class="icon-button compact" type="button" title="Close library">✕</button>
    </div>
    <div id="libraryTabs" class="sheet-tabs"></div>
    <div id="libraryContent" class="library-content"></div>
  </aside>

  <dialog id="rowEditorDialog" class="editor-dialog">
    <form method="dialog" class="editor-dialog-shell">
      <div class="editor-dialog-head">
        <div>
          <p class="eyebrow">Reference Row Editor</p>
          <h3 id="editorDialogTitle">Edit row</h3>
        </div>
        <button id="closeEditorButton" class="icon-button compact" type="button">✕</button>
      </div>
      <div id="editorDialogBody" class="editor-dialog-body"></div>
      <div class="editor-dialog-actions">
        <button id="saveEditorButton" class="primary-button" type="button">Save row</button>
      </div>
    </form>
  </dialog>

  <datalist id="portCodes"></datalist>
  <datalist id="fuelTypes"></datalist>
  <datalist id="imoNumbers"></datalist>

  <script type="module" src="/app.js"></script>
</body>
</html>
